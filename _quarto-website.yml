project:
  type: book
  output-dir: _book
book:
  title: 'The inherent bias in studies reporting outcomes using total opioid burden
    metrics: a simulation study'
  search: false
  downloads:
    - pdf
    - docx
  chapters:
    - index.qmd
    - communication.qmd
    - author_contributions.qmd
    - references.qmd
  appendices:
    - sm-proofs.qmd
    - sm-simulations.qmd
    - sm-lit-review.qmd
    - sm-lit-protocol.qmd
comments:
  hypothesis:
    theme: clean
    openSidebar: false
format:
  html:
    toc: true
    toc-location: left
    fig-align: center
    fig-width: 6.5
    fig-height: 4
    fig-dpi: 150
  pdf:
    documentclass: scrreprt
    geometry:
      - top=30mm
      - left=20mm
      - heightrounded
    toc: true
    fig-align: center
    fig-width: 5
    fig-height: 3
    fig-dpi: 300
    output-file: ome_simulation.pdf
    fig-pos: H
  docx:
    toc: true
    fig-align: center
    fig-width: 5
    fig-height: 3
    fig-dpi: 300
    output-file: ome_simulation

